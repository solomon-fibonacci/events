name: Django E2E Tests

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev build-essential libssl-dev libffi-dev python3-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create environment file
      run: |
        cat > .env << EOF
        SECRET_KEY=test-secret-key-for-ci
        DEBUG=True
        ALLOWED_HOSTS=localhost,127.0.0.1
        DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db
        CORS_ALLOW_ALL_ORIGINS=True
        STRIPE_PUBLIC_KEY=pk_test_fake
        STRIPE_SECRET_KEY=sk_test_fake
        STRIPE_WEBHOOK_SECRET=whsec_test_fake
        RESEND_API_KEY=re_test_fake
        DEFAULT_FROM_EMAIL=noreply@test.com
        SITE_URL=http://localhost:8000
        FRONTEND_URL=http://localhost:3000
        EOF

    - name: Check Django configuration
      run: |
        python manage.py check

    - name: Run migrations
      run: |
        python manage.py migrate --noinput

    - name: Run E2E Tests with Coverage
      run: |
        coverage run --source='.' manage.py test --verbosity=2
        coverage report
        coverage xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Check for test failures
      if: failure()
      run: |
        echo "Tests failed! Please check the logs above."
        exit 1

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,venv,env
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=migrations,venv,env

    - name: Check code formatting with black
      run: |
        black --check --exclude='migrations|venv|env' .
      continue-on-error: true

    - name: Check imports with isort
      run: |
        isort --check-only --skip migrations --skip venv --skip env .
      continue-on-error: true

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev build-essential libssl-dev libffi-dev python3-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run safety check
      run: |
        safety check --json || true

    - name: Run bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json --exclude './venv,./env,*/migrations/*,*/tests/*' || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json

  build-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev build-essential libssl-dev libffi-dev python3-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create environment file
      run: |
        cat > .env << EOF
        SECRET_KEY=test-secret-key-for-build
        DEBUG=False
        ALLOWED_HOSTS=localhost
        EOF

    - name: Check Django configuration
      run: |
        python manage.py check --deploy

    - name: Collect static files
      run: |
        python manage.py collectstatic --noinput || echo "Static collection failed, but continuing..."
